<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="description" content="Calc Pro — A modern, feature-rich calculator with scientific mode, history panel, keyboard support, and dark/light themes." />
  <meta name="theme-color" content="#09090f" />
  <title>Calc Pro — Modern Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/css/base.css" />
  <link rel="stylesheet" href="src/css/calculator.css" />
  <link rel="stylesheet" href="src/css/animations.css" />
</head>
<body>

  <!-- Backdrop (closes history/shortcuts on click) -->
  <div class="app-backdrop" id="app-backdrop" aria-hidden="true"></div>

  <!-- ══════════════════════════════════
       HISTORY PANEL
  ══════════════════════════════════ -->
  <aside class="history-panel" id="history-panel" role="complementary" aria-label="Calculation history">
    <div class="history-header">
      <h2 class="history-title">History</h2>
      <div class="history-actions">
        <button class="icon-btn" id="clear-hist-btn" aria-label="Clear all history" title="Clear all history">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="history-list" id="history-list" role="list" aria-label="Past calculations">
      <!-- Populated by history.js -->
    </div>
  </aside>

  <!-- ══════════════════════════════════
       CALCULATOR CARD
  ══════════════════════════════════ -->
  <main class="app-wrapper" role="main">
    <div class="calculator" role="application" aria-label="Calculator">

      <!-- ── Header ── -->
      <header class="calc-header">
        <span class="calc-title">Calc Pro</span>
        <div class="header-controls">
          <!-- Keyboard shortcuts -->
          <div style="position:relative">
            <button class="icon-btn" id="shortcuts-btn" aria-label="Show keyboard shortcuts" title="Keyboard shortcuts">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/>
              </svg>
            </button>
            <!-- Shortcuts panel -->
            <div class="shortcuts-panel" id="shortcuts-panel" role="tooltip" aria-label="Keyboard shortcuts">
              <div class="shortcuts-title">Keyboard Shortcuts</div>
              <div class="shortcuts-grid">
                <div class="shortcut-item"><span class="shortcut-label">Calculate</span><span class="shortcut-key">Enter / =</span></div>
                <div class="shortcut-item"><span class="shortcut-label">Clear</span><span class="shortcut-key">Escape</span></div>
                <div class="shortcut-item"><span class="shortcut-label">Delete</span><span class="shortcut-key">Backspace</span></div>
                <div class="shortcut-item"><span class="shortcut-label">Multiply</span><span class="shortcut-key">*</span></div>
                <div class="shortcut-item"><span class="shortcut-label">Divide</span><span class="shortcut-key">/</span></div>
                <div class="shortcut-item"><span class="shortcut-label">Power</span><span class="shortcut-key">^</span></div>
                <div class="shortcut-item"><span class="shortcut-label">Parenthesis</span><span class="shortcut-key">( )</span></div>
                <div class="shortcut-item"><span class="shortcut-label">Copy result</span><span class="shortcut-key">Ctrl+C</span></div>
              </div>
            </div>
          </div>

          <!-- Theme toggle -->
          <button class="icon-btn" id="theme-btn" aria-label="Switch to light mode" title="Toggle theme">
            <!-- Icon injected by ui.js -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>

          <!-- History toggle -->
          <button class="icon-btn" id="history-btn" aria-label="Open history panel" title="Calculation history">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- ── Display ── -->
      <section class="display-area" id="display-area" aria-live="polite" aria-label="Calculator display">
        <div class="display-expression" id="display-expr" aria-label="Expression"></div>
        <div class="display-result" id="display-result" aria-label="Result">0</div>
        <div class="display-footer">
          <span class="memory-indicator" id="mem-indicator" aria-label="Memory stored">M</span>
          <button class="copy-btn" id="copy-btn" aria-label="Copy result to clipboard">Copy</button>
        </div>
      </section>

      <!-- ── Mode Tabs ── -->
      <div class="mode-tabs" role="tablist" aria-label="Calculator mode">
        <button class="mode-tab active" data-mode="standard" role="tab" aria-selected="true"  aria-label="Standard mode">Standard</button>
        <button class="mode-tab"        data-mode="scientific" role="tab" aria-selected="false" aria-label="Scientific mode">Scientific</button>
      </div>

      <!-- ── All buttons (single delegated grid) ── -->
      <div id="btn-grid">

        <!-- ── Scientific section (hidden by default) ── -->
        <section class="scientific-section btn-grid btn-grid-5" id="sci-section" aria-label="Scientific functions">
          <button class="btn btn-sci" data-action="function" data-value="sin"  aria-label="Sine">sin</button>
          <button class="btn btn-sci" data-action="function" data-value="cos"  aria-label="Cosine">cos</button>
          <button class="btn btn-sci" data-action="function" data-value="tan"  aria-label="Tangent">tan</button>
          <button class="btn btn-sci" data-action="function" data-value="log"  aria-label="Logarithm base 10">log</button>
          <button class="btn btn-sci" data-action="function" data-value="ln"   aria-label="Natural logarithm">ln</button>

          <button class="btn btn-sci" data-action="function" data-value="asin" aria-label="Arc sine">sin⁻¹</button>
          <button class="btn btn-sci" data-action="function" data-value="acos" aria-label="Arc cosine">cos⁻¹</button>
          <button class="btn btn-sci" data-action="function" data-value="atan" aria-label="Arc tangent">tan⁻¹</button>
          <button class="btn btn-sci" data-action="function" data-value="sqrt" aria-label="Square root">√</button>
          <button class="btn btn-sci" data-action="square"                     aria-label="Square (x squared)">x²</button>

          <button class="btn btn-sci" data-action="power"                      aria-label="Power (x to the n)">xⁿ</button>
          <button class="btn btn-sci" data-action="function" data-value="abs"  aria-label="Absolute value">|x|</button>
          <button class="btn btn-sci" data-action="constant" data-value="π" data-display="π" aria-label="Pi constant">π</button>
          <button class="btn btn-sci" data-action="constant" data-value="e" data-display="e" aria-label="Euler number e">e</button>
          <button class="btn btn-sci" data-action="openParen"                  aria-label="Open parenthesis">( )</button>
        </section>

        <!-- ── Memory row ── -->
        <div class="btn-grid btn-grid-4">
          <button class="btn btn-memory" data-action="memClear"  aria-label="Memory clear">MC</button>
          <button class="btn btn-memory" data-action="memRecall" aria-label="Memory recall">MR</button>
          <button class="btn btn-memory" data-action="memAdd"    aria-label="Memory add">M+</button>
          <button class="btn btn-memory" data-action="memSub"    aria-label="Memory subtract">M−</button>
        </div>

        <!-- ── Main number pad ── -->
        <div class="btn-grid btn-grid-4">
          <!-- Row 1 -->
          <button class="btn btn-clear"    data-action="clear"                                  aria-label="Clear all">C</button>
          <button class="btn btn-delete"   data-action="delete"                                 aria-label="Delete last character">⌫</button>
          <button class="btn btn-operator" data-action="percent"                                aria-label="Percent">%</button>
          <button class="btn btn-operator" data-action="operator" data-value="/" data-display="÷" aria-label="Divide">÷</button>

          <!-- Row 2 -->
          <button class="btn" data-action="digit" data-value="7" aria-label="7">7</button>
          <button class="btn" data-action="digit" data-value="8" aria-label="8">8</button>
          <button class="btn" data-action="digit" data-value="9" aria-label="9">9</button>
          <button class="btn btn-operator" data-action="operator" data-value="*" data-display="×" aria-label="Multiply">×</button>

          <!-- Row 3 -->
          <button class="btn" data-action="digit" data-value="4" aria-label="4">4</button>
          <button class="btn" data-action="digit" data-value="5" aria-label="5">5</button>
          <button class="btn" data-action="digit" data-value="6" aria-label="6">6</button>
          <button class="btn btn-operator" data-action="operator" data-value="-" data-display="−" aria-label="Subtract">−</button>

          <!-- Row 4 -->
          <button class="btn" data-action="digit" data-value="1" aria-label="1">1</button>
          <button class="btn" data-action="digit" data-value="2" aria-label="2">2</button>
          <button class="btn" data-action="digit" data-value="3" aria-label="3">3</button>
          <button class="btn btn-operator" data-action="operator" data-value="+" data-display="+" aria-label="Add">+</button>

          <!-- Row 5 -->
          <button class="btn" data-action="toggleSign"                           aria-label="Toggle positive negative">+/−</button>
          <button class="btn" data-action="digit"    data-value="0"             aria-label="0">0</button>
          <button class="btn" data-action="decimal"                             aria-label="Decimal point">.</button>
          <button class="btn btn-equal" data-action="equals"                    aria-label="Calculate result">=</button>
        </div>

      </div><!-- /#btn-grid -->

    </div><!-- /.calculator -->
  </main>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
